<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#06120e;--surface:#0d211a;--line:#1c3b30;--text:#effaf5;--muted:#8fb7a7;--violet:#f42a41;--cyan:#00a676;--danger:#ff7a88}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="light"]{--bg:#f1f8f4;--surface:#fff;--line:#cfe5da;--text:#0b2a20;--muted:#4f7566}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Hind Siliguri","Segoe UI",system-ui,sans-serif;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;padding:10px 16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.25rem;letter-spacing:.01em;cursor:pointer;background:none;border:0;padding:0}
.logo img{width:38px;height:38px;border-radius:10px;display:block}
.logo b{color:var(--text)}.logo span{color:#f42a41}
.search{flex:1;min-width:180px;max-width:520px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 16px}
.tools{display:flex;gap:6px;margin-left:auto}
.ib{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:.9rem}
.ib:hover{border-color:var(--violet)}
main{max-width:1200px;margin:0 auto;padding:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}
.chip{white-space:nowrap;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.9rem}
.chip.on{background:var(--cyan);border-color:transparent;color:#fff;font-weight:600}
.sub{color:var(--muted);font-size:.9rem;margin:4px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;padding:0;display:block;width:100%}
.card:hover{border-color:var(--cyan)}
.thumb{aspect-ratio:16/9;background:linear-gradient(135deg,#006a4e,#0a2e24);position:relative;display:grid;place-items:center}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb span{width:46px;height:46px;border-radius:50%;background:#0008;display:grid;place-items:center;position:relative;color:#fff}
.meta{padding:10px 12px}
.meta h3{margin:0 0 4px;font-size:1rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta p{margin:0;color:var(--muted);font-size:.85rem}
.empty{border:1px dashed var(--line);border-radius:14px;padding:32px;text-align:center;color:var(--muted)}
.channels{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.ch{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;gap:10px;align-items:center;text-align:left}
.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#00a676,#006a4e);display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.modal{position:fixed;inset:0;background:#000d;z-index:20;display:none;overflow-y:auto;padding:16px}
.modal.open{display:block}
.box{max-width:900px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.player{aspect-ratio:16/9;width:100%;background:#000;border-radius:12px;overflow:hidden}
.player iframe{width:100%;height:100%;border:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.pill{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 12px}
.pill.fav{border-color:var(--violet)}
.pill.rep:hover{border-color:var(--danger);color:var(--danger)}
.f{display:grid;gap:8px;margin:10px 0}
.f input,.f select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;width:100%}
.item{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.x{background:none;border:1px solid var(--line);border-radius:8px;padding:3px 9px;color:var(--danger)}
h2{margin:18px 0 8px;font-size:1.1rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--violet);color:#fff;padding:8px 18px;border-radius:999px;z-index:40;display:none}
.note{font-size:.8rem;color:var(--muted)}
.layout{display:flex;align-items:flex-start}
.layout main{flex:1;min-width:0}
#side{width:240px;flex:none;position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);height:calc(100dvh - 58px - env(safe-area-inset-top,0px));overflow-y:auto;padding:10px 8px 24px;border-right:1px solid var(--line);background:var(--bg)}
body:not(.sbo) #side{display:none}
.si{display:flex;gap:14px;align-items:center;width:100%;background:none;border:0;border-radius:10px;padding:9px 12px;text-align:left;font-size:.92rem}
.si:hover{background:var(--surface)}
.si.on{background:var(--surface);font-weight:700;box-shadow:inset 3px 0 0 var(--violet)}
.si svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.si span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.si .av{width:24px;height:24px;font-size:.7rem}
.sh{margin:12px 12px 4px;font-weight:700}
.sd{border-top:1px solid var(--line);margin:8px 0}
#bd{display:none}
@media(max-width:899px){#side{position:fixed;top:0;left:0;bottom:0;height:auto;z-index:15;width:270px;padding-top:calc(env(safe-area-inset-top,0px) + 10px)}body.sbo #bd{display:block;position:fixed;inset:0;background:#0009;z-index:14}}
</style>

function toast(m){var e=$("toast");e.textContent=m;e.style.display="block";setTimeout(function(){e.style.display="none"},2200)}
function applyTheme(){document.documentElement.setAttribute("data-theme",S.theme);$("theme").textContent=S.theme==="dark"?"☀":"☾"}
function api(p,o){o=o||{};o.headers=Object.assign({"content-type":"application/json"},o.headers||{});var pw=sessionStorage.getItem("iqraAdmin");if(pw)o.headers["x-admin"]=pw;
 return fetch("/api"+p,o).then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.error||r.status);return d})})}
function load(){return Promise.all([api("/catalog"),api("/feed")]).then(function(r){CH=r[0].channels;VIDS=r[1].videos;loaded=true;err="";render()}).catch(function(e){loaded=true;err=e.message;render()})}
function card(v){var c=chOf(v.ch)||{name:""};
 return '<button class="card" data-v="'+v.id+'"><div class="thumb"><img loading="lazy" alt="" src="https://i.ytimg.com/vi/'+v.id+'/mqdefault.jpg" onerror="this.remove()"><span>▶</span></div><div class="meta"><h3>'+esc(v.title)+'</h3><p>'+esc(c.name)+'</p></div></button>'}
function render(){
 $("q").placeholder=t("ph");$("lang").textContent=S.lang==="bn"?"EN":"বাং";
 var cats=["all"].concat(Array.from(new Set(CH.map(function(c){return c.cat}))));
 $("chips").innerHTML=cats.map(function(c){return '<button class="chip'+(cat===c?' on':'')+'" data-c="'+esc(c)+'">'+(c==="all"?t("all"):esc(c))+'</button>'}).join("");
 var h="";
 if(!loaded)h='<div class="empty">'+t("load")+'</div>';
 else if(err)h='<div class="empty">⚠ '+esc(err)+'</div>';
 else{
  var LS={fav:S.favs,history:S.history,later:S.later},list;
  if(LS[mode]){list=LS[mode].filter(function(v){return chOf(v.ch)});
   h+='<h2>'+{fav:t("fav"),history:t("hist"),later:t("later")}[mode]+'</h2>'+(list.length?'<div class="grid">'+list.map(card).join("")+'</div>':'<div class="empty">'+t("nolist")+'</div>');
  }else{
   list=VIDS.filter(function(v){var c=chOf(v.ch);return c&&(!chf||v.ch===chf)&&(cat==="all"||c.cat===cat)&&(!q||(v.title+" "+c.name).toLowerCase().indexOf(q)>-1)});
   var chs=CH.filter(function(c){return cat==="all"||c.cat===cat});
   if(chs.length&&!q&&!chf)h+='<h2>'+t("chs")+'</h2><div class="channels">'+chs.map(function(c){return '<button class="ch" data-ch="'+c.id+'"><div class="av">'+esc(c.name.charAt(0).toUpperCase())+'</div><div><b>'+esc(c.name)+'</b><div class="note">'+esc(c.cat)+'</div></div></button>'}).join("")+'</div>';
   h+='<h2>'+(chf&&chOf(chf)?esc(chOf(chf).name):t("vids"))+'</h2>'+(list.length?'<div class="grid">'+list.map(card).join("")+'</div>':'<div class="empty">'+t("none")+'</div>');
  }
 }
 $("view").innerHTML=h;side();
}
function openV(id){
 var v=findV(id);if(!v)return;
 S.history=[mk(v)].concat(S.history.filter(function(x){return x.id!==id})).slice(0,50);save();
 $("pl").innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+id+'?rel=0&modestbranding=1&playsinline=1" allow="accelerometer; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>';
 $("pt").textContent=v.title;$("pc").textContent=t("from")+": "+(chOf(v.ch)||{}).name;
 var f=has(S.favs,id);$("pf").textContent=f?t("remF"):t("addF");$("pf").className="pill"+(f?" fav":"");
 $("pr").textContent="⚑ "+t("rep");var lt=has(S.later,id);$("pw").textContent=lt?"✓ "+t("later"):"⏱ "+t("addL");$("pw").className="pill"+(lt?" fav":"");
 $("pcl").textContent=t("close");$("pm").classList.add("open");$("pm").dataset.v=id;
}
function closeV(){$("pl").innerHTML="";$("pm").classList.remove("open")}
function toggle(key,id){var v=findV(id);if(!v)return;if(has(S[key],id))S[key]=S[key].filter(function(x){return x.id!==id});else S[key].push(mk(v));save();openV(id);render()}
$("pf").onclick=function(){toggle("favs",$("pm").dataset.v)};
$("pw").onclick=function(){toggle("later",$("pm").dataset.v)};
$("pr").onclick=function(){api("/report",{method:"POST",body:JSON.stringify({id:$("pm").dataset.v})}).then(function(){toast(t("rep_ok"))}).catch(function(e){toast(e.message)})};
$("pcl").onclick=closeV;
$("pm").addEventListener("click",function(e){if(e.target===$("pm"))closeV()});
/* ---- admin ---- */
function renderAdmin(){
 $("at").textContent=t("ad");
 var pw=sessionStorage.getItem("iqraAdmin");
 if(!pw){$("ab").innerHTML='<div class="f"><input id="ap" type="password" placeholder="'+t("pw")+'"><button class="pill" id="al">'+t("login")+'</button></div>';return}
 api("/admin").then(function(d){
  var h='<h2>'+t("addCh")+'</h2><div class="f"><input id="n1" placeholder="'+t("chUrl")+'"><input id="n2" placeholder="'+t("cat")+'"><button class="pill" id="b1">'+t("add")+'</button></div>';
  h+='<h2>'+t("chs")+'</h2>'+(CH.map(function(c){return '<div class="item"><span>'+esc(c.name)+' · '+esc(c.cat)+'</span><button class="x" data-dc="'+c.id+'">'+t("del")+'</button></div>'}).join("")||'<p class="note">—</p>');
  h+='<h2>'+t("reps")+'</h2>'+(d.reports.map(function(id){var v=findV(id);return '<div class="item"><span>'+esc(v?v.title:id)+'</span><button class="x" data-bl="'+id+'">'+t("blk")+'</button></div>'}).join("")||'<p class="note">—</p>');
  h+='<h2>'+t("blkd")+'</h2>'+(d.blocked.map(function(id){return '<div class="item"><span>'+id+'</span><button class="x" data-ub="'+id+'">'+t("unb")+'</button></div>'}).join("")||'<p class="note">—</p>');
  $("ab").innerHTML=h;
 }).catch(function(e){sessionStorage.removeItem("iqraAdmin");toast(e.message);renderAdmin()});
}
$("adminBtn").onclick=function(){$("am").classList.add("open");renderAdmin()};
$("acl").onclick=function(){$("am").classList.remove("open")};
function post(p,b,m){return api(p,{method:m||"POST",body:b?JSON.stringify(b):undefined})}
$("ab").addEventListener("click",function(e){var g=e.target;
 if(g.id==="al"){sessionStorage.setItem("iqraAdmin",$("ap").value);renderAdmin()}
 else if(g.id==="b1"){var u=$("n1").value.trim();if(!u)return;toast(t("load"));post("/channels",{input:u,cat:$("n2").value.trim()||"General"}).then(function(){return load()}).then(function(){toast(t("ok"));renderAdmin()}).catch(function(x){toast(x.message)})}
 else if(g.dataset.dc){post("/channels/"+g.dataset.dc,null,"DELETE").then(load).then(renderAdmin).catch(function(x){toast(x.message)})}
 else if(g.dataset.bl){post("/block",{id:g.dataset.bl,block:true}).then(load).then(renderAdmin).catch(function(x){toast(x.message)})}
 else if(g.dataset.ub){post("/block",{id:g.dataset.ub,block:false}).then(load).then(renderAdmin).catch(function(x){toast(x.message)})}
});
/* ---- nav ---- */
$("view").addEventListener("click",function(e){var c=e.target.closest("[data-v]");if(c){openV(c.dataset.v);return}var h=e.target.closest("[data-ch]");if(h){chf=h.dataset.ch;cat="all";mode="home";render()}});
$("chips").addEventListener("click",function(e){var c=e.target.closest("[data-c]");if(c){cat=c.dataset.c;chf=null;mode="home";render()}});
$("q").oninput=function(){q=this.value.trim().toLowerCase();mode="home";render()};
$("lang").onclick=function(){S.lang=S.lang==="bn"?"en":"bn";save();render()};
$("theme").onclick=function(){S.theme=S.theme==="dark"?"light":"dark";save();applyTheme()};
$("home").onclick=function(){mode="home";cat="all";chf=null;q="";$("q").value="";render()};
var P={home:"M3 11l9-8 9 8v10h-6v-6H9v6H3z",hist:"M3 12a9 9 0 1 0 3-6.7M3 4v5h5M12 7v5l3 2",later:"M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0-18zM12 7v5l3 2",like:"M12 21s-8-5.5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 10c0 5.5-8 11-8 11z",tag:"M4 4h8l8 8-8 8-8-8z"};
function ic(d){return '<svg viewBox="0 0 24 24"><path d="'+d+'"/></svg>'}
function it(a,d,l,on){return '<button class="si'+(on?' on':'')+'" '+a+'>'+d+'<span>'+l+'</span></button>'}
function side(){
 var h=it('data-go="home"',ic(P.home),t("home"),mode==="home"&&cat==="all"&&!chf);
 h+='<div class="sd"></div><div class="sh">'+t("chs")+'</div>'+CH.map(function(c){return it('data-sc="'+c.id+'"','<div class="av">'+esc(c.name.charAt(0).toUpperCase())+'</div>',esc(c.name),chf===c.id)}).join("");
 h+='<div class="sd"></div><div class="sh">'+t("you")+'</div>'+it('data-go="history"',ic(P.hist),t("hist"),mode==="history")+it('data-go="later"',ic(P.later),t("later"),mode==="later")+it('data-go="fav"',ic(P.like),t("fav"),mode==="fav");
 var cs=Array.from(new Set(CH.map(function(c){return c.cat})));
 h+='<div class="sd"></div><div class="sh">'+t("exp")+'</div>'+cs.map(function(c){return it('data-sx="'+esc(c)+'"',ic(P.tag),esc(c),mode==="home"&&cat===c&&!chf)}).join("");
 $("side").innerHTML=h;
}
$("side").addEventListener("click",function(e){var b=e.target.closest(".si");if(!b)return;
 if(b.dataset.go){mode=b.dataset.go;cat="all";chf=null}else if(b.dataset.sc){chf=b.dataset.sc;cat="all";mode="home"}else if(b.dataset.sx){cat=b.dataset.sx;chf=null;mode="home"}
 q="";$("q").value="";render();window.scrollTo(0,0);if(window.innerWidth<900)document.body.classList.remove("sbo")});
$("menu").onclick=function(){document.body.classList.toggle("sbo")};
$("bd").onclick=function(){document.body.classList.remove("sbo")};
if(window.innerWidth>=900)document.body.classList.add("sbo");
applyTheme();render();load();
</script>
</body>
</html>
